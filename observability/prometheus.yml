global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'demo-services'
    metrics_path: /metrics
    static_configs:
      # P0-07: 每目标带 service 标签 —— ServiceDown/HighCPU 等规则也能按服务路由
      - targets:
          - 'gateway:8005'
        labels:
          service: gateway
      - targets:
          - 'order-service:8006'
        labels:
          service: order-service
      - targets:
          - 'inventory-service:8007'
        labels:
          service: inventory-service
      - targets:
          - 'payment-service:8004'
        labels:
          service: payment-service

  # P2-FI-08: actuator 分端口后 scrape 目标同步改 8085（原 8080 已 404 —— 静默断链修复）
  - job_name: 'control-plane'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'control-plane:8085'

  - job_name: 'agent-runtime'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'agent-runtime:8080'

  - job_name: 'tool-server'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'tool-server:8081'
        labels:
          service: control-plane

  # P1-FI-06: 幻影规则落真 —— exporter 真实指标
  - job_name: 'redis-exporter'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          service: redis

  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          service: postgres