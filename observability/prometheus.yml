global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'demo-services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'gateway:8005'
          - 'order-service:8006'
          - 'inventory-service:8007'
          - 'payment-service:8004'

  - job_name: 'control-plane'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'control-plane:8080'