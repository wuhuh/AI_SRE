groups:
  # P2-FI-09: SLO recording rules（30d 窗口 burn rate）—— 指标本身不加告警，
  # 供 Grafana error budget 面板与未来 burn-rate 告警取数
  - name: ai-sre-slo
    interval: 30s
    rules:
      - record: sli:demo_availability_ratio
        expr: |
          1 - (
            sum by (service) (rate(http_requests_total{status=~"5.."}[30d]))
            / clamp_min(sum by (service) (rate(http_requests_total[30d])), 1)
          )
      - record: sli:demo_error_rate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[30d]))
          / clamp_min(sum by (service) (rate(http_requests_total[30d])), 1)
      - record: sli:demo_latency_p95_seconds
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[30d])))
      - record: slo:demo_error_budget_remaining
        expr: |
          1 - (sli:demo_error_rate / 0.01)

  - name: ai-sre-demo
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1)
          > 0.01
        for: 2m
        labels:
          severity: P1
          alertName: high_error_rate
          resource: demo-service
        annotations:
          summary: "{{ $labels.service }} high error rate"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))
          > 0.5
        for: 2m
        labels:
          severity: P2
          alertName: high_latency
          resource: demo-service
        annotations:
          summary: "{{ $labels.service }} p95 latency too high"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: P1
          alertName: service_down
          resource: "{{ $labels.instance }}"
        annotations:
          summary: "{{ $labels.job }} is down"

      - alert: HighCPU
        # P1-FI-03: 阈值对齐真实注入——busy-loop 实测 avg rate≈0.79-0.83，
        # 0.8 贴边易漏报，0.7 保证 cpu_saturation 故障可靠触发
        expr: |
          avg by (instance) (rate(process_cpu_seconds_total[5m])) > 0.7
        for: 5m
        labels:
          severity: P2
          alertName: high_cpu
          resource: "{{ $labels.instance }}"
        annotations:
          summary: "{{ $labels.instance }} CPU usage high"

      - alert: HighMemory
        expr: |
          process_resident_memory_bytes > 500 * 1024 * 1024
        for: 5m
        labels:
          severity: P2
          alertName: high_memory
          resource: "{{ $labels.instance }}"
        annotations:
          summary: "{{ $labels.instance }} memory usage high"

      - alert: RedisPoolHigh
        expr: |
          redis_connected_clients > 100
        for: 2m
        labels:
          severity: P2
          alertName: redis_pool_high
          resource: redis
        annotations:
          summary: "Redis connection pool usage high"

      - alert: DatabasePoolHigh
        # P1-FI-06: postgres-exporter 真实指标（原 db_active_connections 无数据源）
        expr: |
          sum(pg_stat_database_numbackends) > 50
        for: 2m
        labels:
          severity: P2
          alertName: database_pool_high
          resource: postgres
        annotations:
          summary: "Database connection pool usage high"

      # RocketMQLagHigh 已删除（P1-FI-06）：rocketmq-exporter 镜像在可达源均不可得，
      # 无数据源的规则永不触发=虚假可观测；恢复需先落 exporter 再加回规则