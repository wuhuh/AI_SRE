route:
  receiver: 'aisre-control-plane'
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: 'aisre-control-plane'
    webhook_configs:
      # P0-07: 走 AM v4 契约适配端点（labels/annotations 映射 + 5min 去重）
      - url: 'http://control-plane:8080/api/v1/alerts/alertmanager'
        send_resolved: true