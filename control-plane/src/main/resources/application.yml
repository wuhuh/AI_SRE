spring:
  application:
    name: control-plane
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aisre}
    username: ${DB_USERNAME:aisre}
    password: ${DB_PASSWORD:aisre}
  jpa:
    hibernate:
      # P1-CP-17: schema 单轨——Flyway 是唯一 schema 来源，实体漂移启动即失败（validate）
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:aisre-control-plane}

server:
  port: ${SERVER_PORT:8080}

management:
  # P1-CP-14: 管理端点独立端口（默认 8085），不再与业务端口同面暴露
  server:
    port: ${MANAGEMENT_PORT:8085}
  # P2-CP-21: readiness/liveness 分离探针（/actuator/health/{liveness|readiness}）
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus