name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test control-plane
        working-directory: control-plane
        run: mvn -B -ntp test

  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: agent-runtime
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        working-directory: agent-runtime
        run: python -m unittest discover -s tests -v
      - name: Run all local tests
        run: python run_all_local_tests.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t aisre/control-plane:ci control-plane
      - name: Build agent-runtime image
        run: docker build -f agent-runtime/Dockerfile -t aisre/agent-runtime:ci .
      - name: Build tool-server image
        run: docker build -t aisre/tool-server:ci tool-server
      - name: Build demo services
        run: |
          docker build -f demo-services/gateway/Dockerfile -t aisre/gateway:ci demo-services
          docker build -f demo-services/order-service/Dockerfile -t aisre/order-service:ci demo-services
          docker build -f demo-services/inventory-service/Dockerfile -t aisre/inventory-service:ci demo-services
          docker build -f demo-services/payment-service/Dockerfile -t aisre/payment-service:ci demo-services