name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # P2-CI-02: nightly 真实集成（compose + E2E + k6 冒烟 + 评测冒烟）
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      live_llm:
        description: 'Run real-fault E2E with real LLM (requires OPENAI_* secrets)'
        type: boolean
        default: false

jobs:
  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # P3-CI-04: Maven 本地仓库缓存（按 pom 哈希失效）
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('control-plane/pom.xml') }}
          restore-keys: m2-
      - name: Build and test control-plane
        working-directory: control-plane
        run: mvn -B -ntp test

  # P1-CP-17: 集成链路 + schema 单轨断言（ddl-auto=validate 启动即校验实体↔Flyway 对齐）
  java-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('control-plane/pom.xml') }}
          restore-keys: m2-
      - name: Integration tests (testcontainers)
        working-directory: control-plane
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          DOCKER_API_VERSION: '1.44'
        # PIPESTATUS 取回 mvn 真实退出码（tee 只看管道尾）
        run: |
          mvn -B -ntp -Pintegration -DargLine="-Dapi.version=1.44" test 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      # CI 诊断：失败摘要通过 ::error:: 注解回传（annotations 匿名可读，
      # 免去 job log 的 admin 权限墙）
      - name: Annotate failure summary
        if: failure()
        run: |
          cd control-plane
          if [ -d target/surefire-reports ]; then
            grep -h -B1 -A4 "AssertionFailedError\|ERROR\!" target/surefire-reports/*.txt 2>/dev/null | head -20 | while IFS= read -r line; do
              echo "::error ::$line"
            done
          fi
          # 诊断证据：两次 ingest 的响应体（duplicate 字段一锤定音）+ dedup 线索
          grep -E "chain-it\]|alert ingested|dedup unavailable|probe" build.log 2>/dev/null | head -14 | while IFS= read -r line; do
            echo "::error ::$line"
          done

  # P3-CI-04: Python 版本统一 3.11（与 agent Dockerfile python:3.11-slim 一致）+ pip 缓存
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent-runtime/requirements-dev.txt
      - name: Install dependencies
        working-directory: agent-runtime
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          # P3-CI-04 版本统一：pin 已本地验证的 ruff（CI 拉最新版规则漂移会红）
          pip install "ruff==0.16.6"
      - name: Lint (ruff)
        run: ruff check agent-runtime
      # P3-CI-04 去重：run_all_local_tests 内含 unittest discover，不再单独跑一遍
      - name: Run all local tests (linted code; unit tests inside)
        run: python run_all_local_tests.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web (React/vite)
        working-directory: web
        run: |
          npm ci
          npm run build

  # P2-CI-02: nightly —— 全栈 compose + 真实 E2E + k6 冒烟 + 评测冒烟
  # （CI-03 遗留：需用户 push 到 GitHub 后才会产生真实运行记录）
  nightly-integration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compose up (full stack)
        run: docker compose up -d --build
      - name: Wait for control-plane health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health | grep -q '"status":"ok"' && exit 0
            sleep 5
          done
          docker compose logs control-plane | tail -50
          exit 1
      - name: Real-fault E2E (compose)
        env:
          RUN_E2E: '1'
          WEBHOOK_TOKEN: local-dev-webhook-token
          AGENT_TOKEN: local-dev-agent-token
        run: python e2e/local_contract_smoke.py
      - name: k6 smoke (webhook ingestion)
        run: |
          docker run --rm --network host -v "$PWD/benchmark":/scripts             grafana/k6:0.53.0 run --vus 5 --duration 15s /scripts/alert-ingestion.js
      - name: Evaluation smoke (mock, 2 cases)
        run: |
          pip install -q pyyaml
          python evaluation/runner/run_evaluation.py --splits all --limit 2 --provider mock
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail 100 > compose-failure.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nightly-logs
          path: compose-failure.log

  # Phase 4: nightly mock 真实故障 E2E；无 secret，验证工具链 + 恢复闭环。
  real-fault-e2e-mock:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.live_llm != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_RETRIES: '2'
      E2E_RETRY_DELAY_SECONDS: '5'
      VERIFICATION_MIN_REQUESTS: '1'
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent-runtime/requirements-dev.txt
      - name: Install Python dependencies
        working-directory: agent-runtime
        run: pip install -r requirements-dev.txt
      - name: Start stack
        run: |
          docker compose up -d --build \
            postgres redis rocketmq-namesrv \
            prometheus alertmanager loki promtail jaeger otel-collector \
            redis-exporter postgres-exporter tool-server \
            gateway order-service inventory-service payment-service control-plane
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            ok=1
            curl -fsS http://localhost:8080/health >/dev/null || ok=0
            curl -fsS http://localhost:8000/health >/dev/null || ok=0
            curl -fsS http://localhost:8001/health >/dev/null || ok=0
            curl -fsS http://localhost:8002/health >/dev/null || ok=0
            curl -fsS http://localhost:8003/health >/dev/null || ok=0
            curl -fsS http://localhost:8082/health >/dev/null || ok=0
            curl -fsS http://localhost:9090/-/ready >/dev/null || ok=0
            curl -fsS http://localhost:16686/ >/dev/null || ok=0
            curl -fsS http://localhost:3100/loki/api/v1/labels >/dev/null || ok=0
            if [ "$ok" = "1" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail 100 || true
          exit 1
      - name: Seed traffic
        run: |
          for i in $(seq 1 20); do
            curl -s -X POST http://localhost:8000/api/orders \
              -H 'Content-Type: application/json' -d '{}' >/dev/null || true
          done
          # 给 Prometheus 至少两个 scrape interval（5s）落盘，再开始注入故障
          sleep 10
      - name: Start Agent Runtime
        working-directory: agent-runtime
        env:
          LLM_PROVIDER: mock
          AUTO_CONSUME: 'false'
          DIAG_BUDGET_SECONDS: '120'
          LLM_TIMEOUT_SECONDS: '120'
          PROMETHEUS_URL: http://localhost:9090
          LOKI_URL: http://localhost:3100
          TEMPO_URL: http://localhost:16686
          KUBE_TOOL_URL: http://localhost:8082
          REDIS_TOOL_URL: http://localhost:8082
          DATABASE_TOOL_URL: http://localhost:8082
          CONTROL_PLANE_URL: http://localhost:8080
          AGENT_TOKEN: local-dev-agent-token
          VERIFICATION_MIN_REQUESTS: '1'
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8081 > agent.log 2>&1 &
          echo $! > agent.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat agent.log
          exit 1
      - name: Real-fault E2E
        working-directory: agent-runtime
        env:
          RUN_E2E: '1'
          E2E_RETRIES: '2'
          E2E_RETRY_DELAY_SECONDS: '5'
          VERIFICATION_MIN_REQUESTS: '1'
          LLM_PROVIDER: mock
          AGENT_URL: http://localhost:8081
          CONTROL_PLANE_URL: http://localhost:8080
          AGENT_TOKEN: local-dev-agent-token
          WEBHOOK_TOKEN: local-dev-webhook-token
          ADMIN_PASSWORD: aisre-dev-admin-pw
          PAYMENT_URL: http://localhost:8001
          INVENTORY_URL: http://localhost:8003
          GATEWAY_URL: http://localhost:8000
        run: python -m unittest tests.e2e.test_real_faults -v
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs --tail 200 > compose-failure.log || true
          cp agent-runtime/agent.log agent-failure.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-fault-e2e-mock-logs
          path: |
            compose-failure.log
            agent-failure.log
          if-no-files-found: ignore
      - name: Stop Agent Runtime
        if: always()
        run: |
          if [ -f agent-runtime/agent.pid ]; then
            kill "$(cat agent-runtime/agent.pid)" || true
          fi
      - name: Compose down
        if: always()
        run: docker compose down -v || true

  # Phase 4: 手动触发真实 LLM E2E；需要 OPENAI_API_KEY/BASE_URL/MODEL secrets。
  real-fault-e2e-live:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.live_llm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_RETRIES: '2'
      E2E_RETRY_DELAY_SECONDS: '5'
      VERIFICATION_MIN_REQUESTS: '1'
      LLM_PROVIDER: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent-runtime/requirements-dev.txt
      - name: Install Python dependencies
        working-directory: agent-runtime
        run: pip install -r requirements-dev.txt
      - name: Start stack
        run: |
          docker compose up -d --build \
            postgres redis rocketmq-namesrv \
            prometheus alertmanager loki promtail jaeger otel-collector \
            redis-exporter postgres-exporter tool-server \
            gateway order-service inventory-service payment-service control-plane
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            ok=1
            curl -fsS http://localhost:8080/health >/dev/null || ok=0
            curl -fsS http://localhost:8000/health >/dev/null || ok=0
            curl -fsS http://localhost:8001/health >/dev/null || ok=0
            curl -fsS http://localhost:8002/health >/dev/null || ok=0
            curl -fsS http://localhost:8003/health >/dev/null || ok=0
            curl -fsS http://localhost:8082/health >/dev/null || ok=0
            curl -fsS http://localhost:9090/-/ready >/dev/null || ok=0
            curl -fsS http://localhost:16686/ >/dev/null || ok=0
            curl -fsS http://localhost:3100/loki/api/v1/labels >/dev/null || ok=0
            if [ "$ok" = "1" ]; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail 100 || true
          exit 1
      - name: Seed traffic
        run: |
          for i in $(seq 1 20); do
            curl -s -X POST http://localhost:8000/api/orders \
              -H 'Content-Type: application/json' -d '{}' >/dev/null || true
          done
          # 给 Prometheus 至少两个 scrape interval（5s）落盘，再开始注入故障
          sleep 10
      - name: Start Agent Runtime
        working-directory: agent-runtime
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AUTO_CONSUME: 'false'
          DIAG_BUDGET_SECONDS: '120'
          LLM_TIMEOUT_SECONDS: '120'
          PROMETHEUS_URL: http://localhost:9090
          LOKI_URL: http://localhost:3100
          TEMPO_URL: http://localhost:16686
          KUBE_TOOL_URL: http://localhost:8082
          REDIS_TOOL_URL: http://localhost:8082
          DATABASE_TOOL_URL: http://localhost:8082
          CONTROL_PLANE_URL: http://localhost:8080
          AGENT_TOKEN: local-dev-agent-token
          VERIFICATION_MIN_REQUESTS: '1'
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8081 > agent.log 2>&1 &
          echo $! > agent.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat agent.log
          exit 1
      - name: Real-fault E2E
        working-directory: agent-runtime
        env:
          RUN_E2E: '1'
          E2E_RETRIES: '2'
          E2E_RETRY_DELAY_SECONDS: '5'
          VERIFICATION_MIN_REQUESTS: '1'
          LLM_PROVIDER: openai
          AGENT_URL: http://localhost:8081
          CONTROL_PLANE_URL: http://localhost:8080
          AGENT_TOKEN: local-dev-agent-token
          WEBHOOK_TOKEN: local-dev-webhook-token
          ADMIN_PASSWORD: aisre-dev-admin-pw
          PAYMENT_URL: http://localhost:8001
          INVENTORY_URL: http://localhost:8003
          GATEWAY_URL: http://localhost:8000
        run: python -m unittest tests.e2e.test_real_faults -v
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs --tail 200 > compose-failure.log || true
          cp agent-runtime/agent.log agent-failure.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-fault-e2e-live-logs
          path: |
            compose-failure.log
            agent-failure.log
          if-no-files-found: ignore
      - name: Stop Agent Runtime
        if: always()
        run: |
          if [ -f agent-runtime/agent.pid ]; then
            kill "$(cat agent-runtime/agent.pid)" || true
          fi
      - name: Compose down
        if: always()
        run: docker compose down -v || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t aisre/control-plane:ci control-plane
      - name: Build agent-runtime image
        run: docker build -f agent-runtime/Dockerfile -t aisre/agent-runtime:ci .
      - name: Build tool-server image
        run: docker build -t aisre/tool-server:ci tool-server
      - name: Build demo services
        run: |
          docker build -f demo-services/gateway/Dockerfile -t aisre/gateway:ci demo-services
          docker build -f demo-services/order-service/Dockerfile -t aisre/order-service:ci demo-services
          docker build -f demo-services/inventory-service/Dockerfile -t aisre/inventory-service:ci demo-services
          docker build -f demo-services/payment-service/Dockerfile -t aisre/payment-service:ci demo-services

  # P3-CI-05: secret 扫描（原 scan-secrets.ps1 仅 Windows 本地）——镜像内 gitleaks，
  # 命中即 exit 1；--redact 防日志回显敏感值
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD":/repo --workdir /repo \
            zricethezav/gitleaks:v8.21.2 detect --source . --redact \
            --no-banner --exit-code 1

  # P3-CI-05: k8s 清单 schema 校验（audit K8S-01 的静态护栏；真实集群验证归 K8S-01）
  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (strict)
        run: |
          docker run --rm -v "$PWD":/work --workdir /work \
            ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary deploy/k8s