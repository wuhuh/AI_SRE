<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SRE Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #F7F8FA; color: #111827; }
    .header { background: #fff; border-bottom: 1px solid #E5E7EB; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
    .stat { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 16px 20px; }
    .stat .label { color: #667085; font-size: 13px; }
    .stat .value { font-size: 28px; font-weight: 600; }
    .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #F2F4F7; font-size: 13px; }
    th { color: #667085; font-weight: 500; background: #F9FAFB; }
    tr:hover td { background: #F9FAFB; cursor: pointer; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
    .btn { background: #2563EB; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-secondary { background: #E5E7EB; color: #111827; margin-left: 8px; }
    .empty { text-align: center; color: #98A2B3; padding: 32px; }
  </style>
</head>
<body>
  <div class="header">
    <strong>AI SRE</strong><span style="color:#667085;font-size:12px;margin-left:8px;">Intelligent Reliability Platform</span>
    <button class="btn" onclick="login()">登录</button>
  </div>
  <div class="container">
    <div class="stats">
      <div class="stat"><div class="label">Incident</div><div class="value" id="stat-total">0</div></div>
      <div class="stat"><div class="label">Recovered</div><div class="value" id="stat-resolved">0</div></div>
      <div class="stat"><div class="label">Active</div><div class="value" id="stat-diagnosing">0</div></div>
      <div class="stat"><div class="label">Pending Approval</div><div class="value" id="stat-approval">0</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;">Recent Incidents</h3>
        <button class="btn" onclick="loadIncidents()">刷新</button>
      </div>
      <div id="incident-list"><div class="empty">加载中...</div></div>
    </div>
    <div id="detail" class="card" style="display:none;"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
