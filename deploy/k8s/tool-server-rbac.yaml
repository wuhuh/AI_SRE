apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-server
  namespace: ai-sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tool-server
  namespace: ai-sre
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tool-server
  namespace: ai-sre
subjects:
  - kind: ServiceAccount
    name: tool-server
    namespace: ai-sre
roleRef:
  kind: Role
  name: tool-server
  apiGroup: rbac.authorization.k8s.io