apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-runtime
  template:
    metadata:
      labels:
        app: agent-runtime
    spec:
      containers:
        - name: agent-runtime
          image: aisre/agent-runtime:latest
          ports:
            - containerPort: 8080
          env:
            - name: LLM_PROVIDER
              value: mock
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: LOKI_URL
              value: http://loki:3100
            - name: TEMPO_URL
              value: http://jaeger:16686
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agent-runtime
  namespace: ai-sre
spec:
  selector:
    app: agent-runtime
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-runtime
  namespace: ai-sre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-runtime
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70