apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gateway
          image: aisre-gateway:k8s01
          ports:
            - containerPort: 8000
          env:
            - name: ORDER_URL
              value: http://order-service:8002
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-sre
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: order
          image: aisre-order-service:k8s01
          ports:
            - containerPort: 8002
          env:
            - name: INVENTORY_URL
              value: http://inventory-service:8003
            - name: PAYMENT_URL
              value: http://payment-service:8001
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ai-sre
spec:
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: inventory
          image: aisre-inventory-service:k8s01
          ports:
            - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ai-sre
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: payment
          image: aisre-payment-service:k8s01
          ports:
            - containerPort: 8001
            - containerPort: 8004
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ai-sre
spec:
  selector:
    app: payment-service
  ports:
    - port: 8001
      targetPort: 8001
