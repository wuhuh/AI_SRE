apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-sre
  namespace: ai-sre
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: ai-sre.local
      http:
        paths:
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  number: 8080