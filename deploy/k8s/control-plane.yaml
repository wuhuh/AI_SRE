apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: aisre/control-plane:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/aisre
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: ROCKETMQ_NAME_SERVER
              value: rocketmq-namesrv:9876
            # P0-06: 认证凭据来自 Secret，strict 模式拒绝默认值启动
            - name: AISRE_SECURITY_STRICT
              value: "true"
            - name: AISRE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: jwtSecret
            - name: AISRE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: adminPassword
            - name: AISRE_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: operatorPassword
            - name: AISRE_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: viewerPassword
            # P0-05: Agent 回调共享 token
            - name: AISRE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: agentToken
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: ai-sre
spec:
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-plane
  namespace: ai-sre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: control-plane
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ai-sre
type: Opaque
stringData:
  username: REPLACE_WITH_DB_USER
  password: REPLACE_WITH_DB_PASSWORD
  # P0-06: 认证凭据（jwtSecret 必须 >=32 字节；口令支持明文或 BCrypt 哈希）
  jwtSecret: REPLACE_WITH_JWT_SECRET_MIN_32_BYTES
  adminPassword: REPLACE_WITH_ADMIN_PASSWORD
  operatorPassword: REPLACE_WITH_OPERATOR_PASSWORD
  viewerPassword: REPLACE_WITH_VIEWER_PASSWORD
  # P0-05: Agent 回调共享 token
  agentToken: REPLACE_WITH_AGENT_TOKEN