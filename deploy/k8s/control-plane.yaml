apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: ai-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: aisre-control-plane:k8s01
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/aisre
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: ROCKETMQ_NAME_SERVER
              value: rocketmq-namesrv:9876
            # P0-06: 认证凭据来自 Secret，strict 模式拒绝默认值启动
            - name: AISRE_SECURITY_STRICT
              value: "true"
            - name: AISRE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: jwtSecret
            - name: AISRE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: adminPassword
            - name: AISRE_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: operatorPassword
            - name: AISRE_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: viewerPassword
            # P0-05: Agent 回调共享 token
            - name: AISRE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: agentToken
            # P1-CP-14: 管理端点独立端口（探针走 8085，业务 8080 不暴露管理面）
            - name: MANAGEMENT_PORT
              value: "8085"
          ports:
            - containerPort: 8085
          # P2-K8S-01: liveness/readiness 分离（P2-CP-21 已有端点）
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 20
          # P2-K8S-01: 容器加固
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: ai-sre
spec:
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: control-plane
  namespace: ai-sre
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: control-plane
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ai-sre
type: Opaque
# P2-K8S-01: 以下为本地 kind 演练值（与 compose .env 默认一致，无真实凭据）。
# 生产必须替换并改用外部 Secret 管理（sealed-secrets/vault），不得入仓。
stringData:
  toolServerToken: local-dev-token
  username: aisre
  password: aisre
  # dev 固定值（>=32B）；生产用 openssl rand -base64 32 轮换
  jwtSecret: dev-only-jwt-secret-0123456789abcdef0123456789abcdef
  adminPassword: aisre-dev-admin-pw
  operatorPassword: aisre-dev-operator-pw
  viewerPassword: aisre-dev-viewer-pw
  agentToken: local-dev-agent-token